[package]
name = "lingxi-capture"
version = "0.1.0"
description = "LingxiGlove dual-device data capture & labeling tool"
authors = ["Haoze.Li <haoze.li@outlook.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lingxi_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime + serial
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures-util = "0.3"

# Serial port enumeration (sync, used inside list_ports command)
serialport = "4"

# Time / IDs / logging
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"

# Cloud upload + Keychain
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
